# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check content.js parses
        run: node -e "global.window={}; require('./js/content.js'); if(!window.COURSE||!window.COURSE.chapters.length) process.exit(1); console.log(window.COURSE.chapters.length + ' chapters OK')"

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          # cache-bust: every deploy gets its own ?v=, so browsers never mix old and new files
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          grep -c "?v=${GITHUB_SHA::7}" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
